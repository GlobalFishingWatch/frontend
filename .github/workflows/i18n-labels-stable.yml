name: i18n-labels stable

on:
  push:
    tags:
      - '@gfw/platform@*'
  workflow_dispatch:

concurrency:
  group: i18n-labels-stable
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Tag latest as stable
        run: |
          LATEST=$(npm dist-tag ls @globalfishingwatch/i18n-labels | grep -Ew 'latest: (.*)' | sed 's/latest: //')
          npm dist-tag add @globalfishingwatch/i18n-labels@$LATEST stable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Purge jsdelivr cache
        run: PACKAGE_TAG=stable ./libs/i18n-labels/purge_jsdelivr.sh
