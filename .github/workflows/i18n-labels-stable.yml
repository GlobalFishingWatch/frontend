name: i18n-labels stable

on:
  push:
    tags:
      - '@gfw/platform@*'
  workflow_dispatch:

concurrency:
  group: i18n-labels-stable
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          install: false # the explicit --frozen-lockfile step below owns installing

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag latest as stable
        run: |
          LATEST=$(npm dist-tag ls @globalfishingwatch/i18n-labels | grep -Ew 'latest: (.*)' | sed 's/latest: //')
          npm dist-tag add @globalfishingwatch/i18n-labels@$LATEST stable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Purge jsdelivr cache
        run: pnpm nx run i18n-labels:purge:stable
