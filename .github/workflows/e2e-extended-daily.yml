name: E2E Extended (daily)

# Runs the `extended` Playwright suite (@smoke + @extended, Chromium) every day against the deployed
# production app, using the test code from main. Production auth only accepts its own callback URLs,
# so the suite can't run against a local dev server there. Failures are reported to Slack.
# Scheduled workflows only run from the default branch of the repository.
on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  e2e-extended:
    name: Run extended e2e suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      PLAYWRIGHT_BASE_URL: https://globalfishingwatch.org
      PLAYWRIGHT_BROWSER: chromium
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          install: false # the explicit --frozen-lockfile step below owns installing

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The map popup test depends on specific vessel data and fails on production, skipped for now
      - name: Run extended e2e suite
        working-directory: apps/platform-e2e
        run: >-
          pnpm exec playwright test --workers=1 --grep "@smoke|@extended"
          --grep-invert "vessel presence popup"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/platform-e2e/playwright-report

  notify-failure:
    name: Notify Slack on failure
    runs-on: ubuntu-latest
    needs: e2e-extended
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Notify Slack
        uses: ./.github/actions/notify-slack
        with:
          channel: '#eng-api-front-test-failures'
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          message: ":red_circle: *Daily extended e2e tests failed* on `main` (production)\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
