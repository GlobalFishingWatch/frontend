name: E2E Extended (daily)

# Runs the `extended` Playwright suite (@smoke + @extended on Chromium, Firefox and WebKit) every
# day against main, with the platform dev server pointed at the production API gateway. Failures are
# reported to Slack. Scheduled workflows only run from the default branch of the repository.
on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  e2e-extended:
    name: Run extended e2e suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN_READ_ONLY }}
      CI: '1'
      VITE_API_GATEWAY: https://gateway.api.globalfishingwatch.org
      VITE_WORKSPACE_ENV: production
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          install: false # the explicit --frozen-lockfile step below owns installing

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Playwright starts the platform dev server itself (webServer in playwright.config.mts)
      - name: Run extended e2e suite
        run: pnpm exec nx run platform-e2e:test:extended
        env:
          NX_DAEMON: 'false'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/platform-e2e/playwright-report

  notify-failure:
    name: Notify Slack on failure
    runs-on: ubuntu-latest
    needs: e2e-extended
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Notify Slack
        uses: ./.github/actions/notify-slack
        with:
          channel: '#eng-api-front-test-failures'
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          message: ":red_circle: *Daily extended e2e tests failed* on `main` (production API)\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
