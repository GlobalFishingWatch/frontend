name: Integration Tests

# Lib unit tests run as `test`. The platform vitest suite runs as `integration-ci`, which the
# @nx/vitest plugin splits into one `integration-ci--<file>` task per spec. All of them are
# run on the runner, one spec at a time. Nx Cloud is disabled (NX_NO_CLOUD): no remote cache and no
# distributed workers.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Run Integration Tests
    # Dependabot runs get no repository secrets (only the separate Dependabot store), so skip them
    # Crowdin's translation PRs (i18n_dev) only touch locale JSON
    if: github.head_ref != 'i18n_dev' && github.event.action != 'closed' && github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # Job-level so every nx step skips Nx Cloud (nxCloudId in nx.json)
    env:
      NX_NO_CLOUD: 'true'
      CI: '1'
      VITE_API_GATEWAY: https://gateway.api.${{ github.event.pull_request.base.ref == 'main' && 'staging' || 'dev' }}.globalfishingwatch.org
      VITE_WORKSPACE_ENV: development

    steps:
      - name: Notify the developer about integration tests running
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          message: |
            ## ⏳ Integration tests are running...
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so nx affected always finds the merge base with the PR's base branch
          fetch-depth: 0
          filter: tree:0

      # --- Setting up dependencies -------------------------------------------

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          install: false # the explicit --frozen-lockfile step below owns installing

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check load boundaries
        run: pnpm exec nx affected -t check-load-boundaries --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD

      # Recordings made locally reach a PR with no other check. A grep over ~10 MB, so it always
      # runs. The test user's email is only checked where secrets are available (not on forks).
      - name: Check recorded API responses for private data
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        run: apps/platform/scripts/check-recordings.sh

      # Only the platform suite needs a browser (lib tests run in jsdom/node). Task-based affected
      # (`-t`) selects a target only when its inputs changed, so a PR that does not touch what
      # platform's specs read skips it.
      - name: Detect affected tests
        id: affected
        run: |
          AFFECTED="--affected --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD --json"
          platform=$(pnpm exec nx show projects -t integration-ci $AFFECTED)
          libs=$(pnpm exec nx show projects -t test --exclude='*-e2e,platform' $AFFECTED)
          echo "platform=$([ "$platform" = "[]" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "libs=$([ "$libs" = "[]" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "Affected: platform $platform, libs $libs"

      # --- Browser -----------------------------------------------------------
      # No login: the platform specs replay recorded API responses with a fake token
      # (apps/platform/test/utils/network/mock-network.ts). Logging in here also invalidated the
      # token of any e2e run using the same test user.
      - name: Cache Playwright browsers
        if: steps.affected.outputs.platform == 'true'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.affected.outputs.platform == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # --- Running tests -----------------------------------------------------

      # Two commands, because `-t test integration-ci` would also run platform:test, the unsplit
      # suite.
      # --parallel=1 runs one spec at a time, so the specs share one browser profile and its tile
      # cache (see vitest.config.ts).
      - name: Run affected tests
        id: run-tests
        if: steps.affected.outputs.platform == 'true' || steps.affected.outputs.libs == 'true'
        run: |
          set -euo pipefail
          AFFECTED="--base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD --output-style=static"
          status=0
          if [ "${{ steps.affected.outputs.libs }}" = "true" ]; then
            pnpm exec nx affected -t test --exclude='*-e2e,platform' $AFFECTED 2>&1 | tee -a test-output.txt || status=1
          fi
          if [ "${{ steps.affected.outputs.platform }}" = "true" ]; then
            pnpm exec nx affected -t integration-ci --parallel=1 $AFFECTED 2>&1 | tee -a test-output.txt || status=1
          fi
          exit $status
        env:
          NX_DAEMON: 'false'
          # Nx refuses atomized tasks (integration-ci--*) when Nx Cloud is off ("should only be run
          # with Nx Cloud"). Running them serially on the runner is intended, so skip that check.
          NX_SKIP_ATOMIZER_VALIDATION: 'true'

      # Without Nx Cloud there is no per-task summary table to parse, so report the step outcome.
      - name: Write test summary
        if: always()
        run: |
          echo -e "## Test Results\n" > summary.md
          case "${{ steps.run-tests.outcome }}" in
            success) echo "All affected tests passed" >> summary.md ;;
            failure) echo "Some tests failed, see the job log" >> summary.md ;;
            *) echo "No tests were run" >> summary.md ;;
          esac
          echo -e "\n[Job log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> summary.md

      - name: Comment on PR with test results
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: summary.md

  update-comment-on-cancel:
    name: Update comment on cancellation
    runs-on: ubuntu-latest
    needs: integration-tests
    if: cancelled()
    permissions:
      pull-requests: write
    steps:
      - name: Update sticky comment to cancelled
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          message: |
            ## 🚫 Integration tests were cancelled
