name: Integration Tests

# Lib unit tests run as `test`. The platform vitest suite runs as `integration-ci`, which the
# @nx/vitest plugin splits into one `integration-ci--<file>` task per spec. All of them are
# distributed to Nx Cloud workers (.nx/ci-config.yaml, launch template in .nx/workflows/agents.yaml).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Run Integration Tests
    if: github.event.action != 'closed' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # Job-level so every nx step reads the Nx Cloud remote cache (nxCloudId in nx.json)
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN_READ_ONLY }}
      # E2E Tests runs its own Nx Cloud main job on the same commit and branch. Without distinct
      # execution envs, Nx Cloud cancels one pipeline when the other starts ("One or more workflows
      # were cancelled"). NX_* variables reach the workers automatically.
      NX_CI_EXECUTION_ENV: integration
      # Forwarded to the workers by .nx/ci-config.integration.yaml (workers.with-env-vars)
      CI: '1'
      VITE_API_GATEWAY: https://gateway.api.${{ github.event.pull_request.base.ref == 'main' && 'staging' || 'dev' }}.globalfishingwatch.org
      VITE_WORKSPACE_ENV: development
      TEST_CHROME_ONLY: 'true'

    steps:
      - name: Notify the developer about integration tests running
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          message: |
            ## ⏳ Integration tests are running...
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so nx affected always finds the merge base with the PR's base branch
          fetch-depth: 0
          filter: tree:0

      # --- Setting up dependencies and workers -------------------------------

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          install: false # the explicit --frozen-lockfile step below owns installing

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check load boundaries
        run: pnpm exec nx affected -t check-load-boundaries --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD

      # Only the platform suite needs a browser, the test user's login and Nx Cloud workers (lib
      # tests run in jsdom/node). Task-based affected (`-t`) selects a target only when its inputs
      # changed, so a PR that does not touch what platform's specs read skips all three.
      - name: Detect affected tests
        id: affected
        run: |
          AFFECTED="--affected --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD --json"
          platform=$(pnpm exec nx show projects -t integration-ci $AFFECTED)
          libs=$(pnpm exec nx show projects -t test --exclude='*-e2e,platform' $AFFECTED)
          echo "platform=$([ "$platform" = "[]" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "libs=$([ "$libs" = "[]" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "Affected: platform $platform, libs $libs"

      # --- Logging in once, for every worker ---------------------------------
      - name: Cache Playwright browsers
        if: steps.affected.outputs.platform == 'true'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.affected.outputs.platform == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Log in the test user
        if: steps.affected.outputs.platform == 'true'
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          pnpm exec nx run platform:test:login
          TOKENS_FILE=apps/platform/test/.auth/tokens.json
          if [ -f "$TOKENS_FILE" ]; then
            echo "::add-mask::$(jq -r .token "$TOKENS_FILE")"
            echo "::add-mask::$(jq -r .refreshToken "$TOKENS_FILE")"
            echo "TEST_AUTH_TOKENS=$(jq -c . "$TOKENS_FILE")" >> "$GITHUB_ENV"
          else
            echo "::warning::Login failed; integration tests run unauthenticated"
          fi

      # `start-workers` reads only .nx/ci-config.yaml, which is the e2e config (stops after
      # `test-ci`), and `start-ci-run` refuses to run while that file exists. So this job swaps in
      # its own config first. Browsers are installed on the workers by the launch template.
      # Without workers (platform not affected) the lib tests below run on this runner: they take
      # seconds, less than booting workers.
      - name: Start Nx Cloud workers
        if: steps.affected.outputs.platform == 'true'
        run: |
          cp .nx/ci-config.integration.yaml .nx/ci-config.yaml
          pnpm dlx nx-cloud start-workers

      # --- Running tests -----------------------------------------------------

      # Two commands, because `-t test integration-ci` would also run platform:test, the unsplit
      # suite. Libs go first: `integration-ci` is the stop-after target in .nx/ci-config.integration.yaml.
      # --parallel=1 runs one spec at a time per worker, so the specs on a worker share one browser
      # profile and its tile cache (see vitest.config.ts).
      - name: Run affected tests
        id: run-tests
        if: steps.affected.outputs.platform == 'true' || steps.affected.outputs.libs == 'true'
        run: |
          set -euo pipefail
          AFFECTED="--base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD --output-style=static"
          status=0
          if [ "${{ steps.affected.outputs.libs }}" = "true" ]; then
            pnpm exec nx affected -t test --exclude='*-e2e,platform' $AFFECTED 2>&1 | tee -a test-output.txt || status=1
          fi
          if [ "${{ steps.affected.outputs.platform }}" = "true" ]; then
            pnpm exec nx affected -t integration-ci --parallel=1 $AFFECTED 2>&1 | tee -a test-output.txt || status=1
          fi
          exit $status
        env:
          NX_DAEMON: 'false'

      # With --output-style=static every task prints as one block headed by "> nx run <task>", and
      # each command ends with Nx's own "Failed tasks:" list, which is the pass/fail source.
      - name: Parse test results
        if: always()
        run: |
          touch test-output.txt # absent when nothing was affected
          sed 's/\x1b\[[0-9;]*[a-zA-Z]//g; s/\x1b\[[?][0-9]*[a-zA-Z]//g' test-output.txt | awk '
            /^> nx run / {
              task = $4
              split(task, parts, ":")
              cur = (parts[2] == "test" || index(parts[2], "integration-ci--") == 1) ? task : ""
              if (cur != "" && !(cur in seen)) { seen[cur] = 1; order[++n] = cur }
              in_failed = 0
              next
            }
            # Start of the Nx run summary: stop attaching lines to the last task
            /^ *(NX |—)/ { cur = ""; next }
            /Failed tasks:/ { in_failed = 1; next }
            in_failed && /^ *- / { sub(/^ *- /, ""); failed[$1] = 1; next }
            cur != "" { output[cur] = (output[cur] == "" ? $0 : output[cur] "\n" $0) }
            END {
              print "## Test Results\n"
              pass_count = 0
              fail_count = 0
              for (i = 1; i <= n; i++) {
                t = order[i]
                status = (t in failed) ? "❌" : "✅"
                printf "<details>\n<summary>%s %s</summary>\n\n```\n%s\n```\n\n</details>\n\n", status, t, output[t]
                if (t in failed) fail_count++; else pass_count++
              }
              if (n == 0) {
                printf "---\n**Summary:** No tests were run\n"
              } else {
                printf "---\n**Summary:** %d passed, %d failed\n", pass_count, fail_count
              }
            }
          ' >> summary.md

      - name: Comment on PR with test results
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: summary.md

  update-comment-on-cancel:
    name: Update comment on cancellation
    runs-on: ubuntu-latest
    needs: integration-tests
    if: cancelled()
    permissions:
      pull-requests: write
    steps:
      - name: Update sticky comment to cancelled
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          message: |
            ## 🚫 Integration tests were cancelled
