name: PR Preview

on:
  pull_request:
    branches: [develop]
    types: [opened, labeled, unlabeled, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-preview:
    uses: ./.github/workflows/_pr-preview.yml
    with:
      preview_label: deploy-preview
      config: .github/apps/development.yml
      cloudrun_project: gfw-development
      cloudrun_service_account: frontend-dev@gfw-development.iam.gserviceaccount.com
      service_name_prefix: pr-${{ github.event.pull_request.number }}-dev-ui
      image: us-central1-docker.pkg.dev/gfw-int-infrastructure/frontend/platform:pr-${{ github.event.pull_request.number }}
      comment_header: preview-platform
    secrets: inherit
