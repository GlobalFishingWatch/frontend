name: E2E Tests

# Runs each affected Playwright spec as its own Nx task (`test-ci--<file>`) on Nx Cloud workers.
# Specs whose inputs did not change replay from the cache (Ultracache records what each one reads).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Run affected e2e specs
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Forwarded to the workers by .nx/ci-config.yaml (workers.with-env-vars)
      PLAYWRIGHT_BROWSER: chromium
      VITE_API_GATEWAY: https://gateway.api.${{ github.event.pull_request.base.ref == 'main' && 'staging' || 'dev' }}.globalfishingwatch.org
      VITE_WORKSPACE_ENV: development
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          install: false # the explicit --frozen-lockfile step below owns installing

      # Before the install, so the workers boot while this job installs
      - name: Start Nx Cloud workers
        run: pnpm dlx nx-cloud start-workers

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run affected e2e specs
        run: pnpm exec nx affected -t test-ci --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/platform-e2e/playwright-report
