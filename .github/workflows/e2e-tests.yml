name: E2E Tests

# Runs the affected Playwright suite on the runner against the platform production build. Nx Cloud
# is disabled (NX_NO_CLOUD): no distributed workers, and the split `test-ci--<file>` tasks refuse to
# run without it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Run affected e2e specs
    # Dependabot runs get no repository secrets (only the separate Dependabot store), so skip them
    # Crowdin's translation PRs (i18n_dev) only touch locale JSON
    if: github.head_ref != 'i18n_dev' && github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: 'true'
      PLAYWRIGHT_BROWSER: chromium
      VITE_API_GATEWAY: https://gateway.api.${{ github.event.pull_request.base.ref == 'main' && 'staging' || 'dev' }}.globalfishingwatch.org
      VITE_WORKSPACE_ENV: development
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          install: false # the explicit --frozen-lockfile step below owns installing

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - uses: ./.github/actions/nx-cache
        with:
          key: e2e-${{ github.event.pull_request.base.ref }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check if e2e specs are affected
        id: affected
        run: echo "projects=$(pnpm nx show projects --affected -t test --projects=platform-e2e --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD --json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.affected.outputs.projects != '[]'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.affected.outputs.projects != '[]' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build platform
        if: steps.affected.outputs.projects != '[]'
        run: pnpm nx run platform:build:app

      - name: Start platform
        if: steps.affected.outputs.projects != '[]'
        env:
          PORT: '3003'
          ALLOW_MISSING_SERVER_ENV: 'true'
        run: |
          node apps/platform/.output/server/index.mjs &
          curl --silent --output /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://localhost:3003

      - name: Run e2e specs
        if: steps.affected.outputs.projects != '[]'
        run: pnpm nx run platform-e2e:test

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/platform-e2e/playwright-report
