name: E2E Tests

# Runs the affected Playwright specs on the runner as `test-ci`, which the Playwright plugin splits
# into one `test-ci--<file>` task per spec; each waits for `platform:start`. Nx Cloud is disabled
# (NX_NO_CLOUD): no distributed workers. Task results are cached per PR by the nx-cache action.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Run affected e2e specs
    # Dependabot runs get no repository secrets (only the separate Dependabot store), so skip them
    # Crowdin's translation PRs (i18n_dev) only touch locale JSON
    if: github.head_ref != 'i18n_dev' && github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: 'true'
      PLAYWRIGHT_BROWSER: chromium
      VITE_API_GATEWAY: https://gateway.api.${{ github.event.pull_request.base.ref == 'main' && 'staging' || 'dev' }}.globalfishingwatch.org
      VITE_WORKSPACE_ENV: development
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          install: false # the explicit --frozen-lockfile step below owns installing

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each push restores the previous push's results. A spec's hash covers all of platform and its
      # libs (implicitDependencies), so a spec reruns on any app change, and a failed job still
      # saves the specs that passed.
      - name: Nx cache
        uses: ./.github/actions/nx-cache
        with:
          key: nx-e2e-tests

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # --parallel=2 matches the 2 Playwright workers the unsplit suite used on this runner
      - name: Run affected e2e specs
        run: pnpm exec nx affected -t test-ci --parallel=2 --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD
        env:
          # Nx refuses atomized tasks (test-ci--*) when Nx Cloud is off. Running them on the runner
          # is intended, so skip that check.
          NX_SKIP_ATOMIZER_VALIDATION: 'true'

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/platform-e2e/playwright-report
