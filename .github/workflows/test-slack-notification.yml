name: Test Slack Notification

on:
  push:
    branches: [feat/notification-slack]

jobs:
  test-slack:
    name: Send test Slack notification
    runs-on: ubuntu-latest
    steps:
      - name: Send test Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "eng-cloud-build"
            text: ":test_tube: *Test notification* from `${{ github.ref_name }}`\n@frontend-engineering-team this is a test of the failure notification added in <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|this run>."
