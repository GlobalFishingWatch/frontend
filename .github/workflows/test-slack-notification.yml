name: Test Slack Notification

on:
  push:
    branches: [feat/notification-slack]

jobs:
  test-slack:
    name: Send test Slack notification
    runs-on: ubuntu-latest
    steps:
      - name: Send test Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          channel-id: eng-cloud-build
          slack-message: |
            :test_tube: *Test notification* from `${{ github.ref_name }}`
            @frontend-engineering-team this is a test of the failure notification added in <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|this run>.
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
