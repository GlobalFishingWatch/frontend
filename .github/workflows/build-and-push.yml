name: Build and Deploy

on:
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-affected:
    name: Detect Affected Apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected apps
        id: detect
        uses: ./.github/actions/detect-affected
        with:
          base: origin/develop~1
          head: HEAD

  build-and-deploy:
    name: Build and Deploy / ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: detect-affected
    if: needs.detect-affected.outputs.apps != '[]'
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-affected.outputs.apps) }}
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/gfw-int-infrastructure/frontend/${{ matrix.app }}:latest-dev
      CONFIG: .github/apps/development.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Build and push
        uses: ./.github/actions/build-and-push
        with:
          app: ${{ matrix.app }}
          image: ${{ env.IMAGE }}
          config: ${{ env.CONFIG }}
          nx-cloud-access-token: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Deploy
        uses: ./.github/actions/deploy-cloudrun
        with:
          app: ${{ matrix.app }}
          image: ${{ env.IMAGE }}
          config: ${{ env.CONFIG }}
          cloudrun-service-account: frontend-dev@gfw-development.iam.gserviceaccount.com
