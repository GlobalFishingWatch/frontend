name: Build and Deploy

on:
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_build-and-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      env-suffix: dev
      config: .github/apps/development.yml
      service-prefix: dev-ui
      cloudrun-project: gfw-development
      environment: development
    secrets: inherit
