name: Build and Deploy (Production)

on:
  push:
    tags:
      - '@gfw/*@*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse-tag:
    name: Parse App from Tag
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.parse.outputs.app }}

    steps:
      - name: Extract app name from tag
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # Tag format: @gfw/<app-name>@<semver>
          APP=$(echo "$TAG" | sed -n 's/^@gfw\/\(.*\)@[0-9]\+\.[0-9]\+\(\.[0-9]\+\(\.\?[0-9]*\)\)\?$/\1/p')
          if [ -z "$APP" ]; then
            echo "::error::Tag '$TAG' does not match expected format @gfw/<app>@<semver>"
            exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Parsed app: $APP from tag $TAG"

  build-and-deploy:
    name: Build and Deploy / ${{ needs.parse-tag.outputs.app }}
    runs-on: ubuntu-latest
    needs: parse-tag
    permissions:
      contents: read
      id-token: write
    env:
      APP: ${{ needs.parse-tag.outputs.app }}
      IMAGE: us-central1-docker.pkg.dev/gfw-int-infrastructure/frontend/${{ needs.parse-tag.outputs.app }}:latest-pro
      CONFIG: .github/apps/production.yml
      SERVICE_NAME_PREFIX: ui
      CLOUDRUN_SA: frontend-pro@gfw-production.iam.gserviceaccount.com
      CLOUDRUN_PROJECT: gfw-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Build and push
        uses: ./.github/actions/build-and-push
        with:
          app: ${{ env.APP }}
          image: ${{ env.IMAGE }}
          config: ${{ env.CONFIG }}
          nx-cloud-access-token: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Deploy
        uses: ./.github/actions/deploy-cloudrun
        with:
          app: ${{ env.APP }}
          image: ${{ env.IMAGE }}
          config: ${{ env.CONFIG }}
          service-name-prefix: ${{ env.SERVICE_NAME_PREFIX }}
          cloudrun-service-account: ${{ env.CLOUDRUN_SA }}
          cloudrun-project: ${{ env.CLOUDRUN_PROJECT }}

  notify-failure:
    name: Notify Slack on failure
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Slack
        uses: ./.github/actions/notify-slack
        with:
          channel: '#eng-cloud-build'
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          message: ":red_circle: *Build and Deploy (Production) failed* on tag `${{ github.ref_name }}`\n<!subteam^S091F43KM6F> please take a look. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
