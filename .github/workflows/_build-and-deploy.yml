name: _Build and Deploy (Reusable workflow)

on:
  workflow_call:
    inputs:
      env-suffix:
        description: Service account suffix — dev, sta or pro
        type: string
        required: true
      config:
        description: Path to the per-app config YAML
        type: string
        required: true
      service-prefix:
        description: Cloud Run service name prefix (dev-ui, sta-ui, ui)
        type: string
        required: true
      cloudrun-project:
        description: GCP project hosting the Cloud Run services
        type: string
        required: true
      environment:
        description: GitHub environment gating the deploy
        type: string
        required: true
      release-tag:
        description: |
          Release tag (@gfw/<app>@<version>) to deploy a single app from.
          Left empty, every app affected by the push is deployed instead.
        type: string
        required: false
        default: ''
      apps:
        description: |
          JSON array of apps to deploy, skipping resolution entirely.
          Used by the flag environments, which only ever deploy platform.
        type: string
        required: false
        default: ''
      image-tag:
        description: |
          Image tag to build and deploy. Defaults to latest-<env-suffix>.
          Flag environments override it so they never overwrite the base env's image.
        type: string
        required: false
        default: ''
      build-args:
        description: |
          Newline-separated KEY=VALUE build args overriding the config's.
          Every KEY needs a matching ARG in the Dockerfile or docker drops it.
        type: string
        required: false
        default: ''
    outputs:
      apps:
        description: JSON array of the apps this run deployed
        value: ${{ jobs.resolve.outputs.apps }}

jobs:
  resolve:
    name: Resolve Apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ inputs.apps || steps.affected.outputs.apps || steps.release.outputs.apps }}

    steps:
      # Nothing to resolve when the caller named the apps outright
      - name: Checkout code
        if: inputs.apps == ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # nx-set-shas walks back to the last successful run
          filter: tree:0

      # Base is the last commit this workflow deployed successfully, not HEAD~1, so the
      # changes of a failed or cancelled run (concurrency cancels in-progress pushes) are
      # deployed by the next push instead of being skipped. Needs `actions: read`.
      - name: Resolve affected range
        id: shas
        if: inputs.apps == '' && inputs.release-tag == ''
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ github.ref_name }}

      # Branch pushes deploy every app affected since the last successful deploy
      - name: Detect affected apps
        id: affected
        if: inputs.apps == '' && inputs.release-tag == ''
        uses: ./.github/actions/detect-affected
        with:
          base: ${{ steps.shas.outputs.base }}
          head: ${{ steps.shas.outputs.head }}

      # Releases deploy the single app named in the tag. Libs release into the
      # same @gfw/<project>@<version> namespace, so a name with no entry in the
      # config is not an app: skip it instead of failing the run.
      - name: Resolve app from release tag
        id: release
        if: inputs.apps == '' && inputs.release-tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.release-tag }}
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          APP="${TAG#@gfw/}"
          APP="${APP%@*}"
          export APP
          if [ "$APP" = "$TAG" ] || [ -z "$APP" ]; then
            echo "::error::Tag '$TAG' does not match @gfw/<app>@<version>"
            exit 1
          fi
          # A missing config is a broken checkout, not a non-app: fail, never skip
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Config '$CONFIG' not found at $TAG"
            exit 1
          fi
          if python3 -c "import os, sys, yaml; sys.exit(0 if os.environ['APP'] in yaml.safe_load(open(os.environ['CONFIG'])) else 1)"; then
            echo "apps=[\"$APP\"]" >> "$GITHUB_OUTPUT"
            echo "Deploying $APP from tag $TAG"
          else
            echo "::notice::'$APP' has no entry in $CONFIG — not a deployable app, skipping"
            echo "apps=[]" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    name: Build and Deploy / ${{ inputs.service-prefix }} / ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.apps != '[]' && needs.resolve.outputs.apps != ''
    environment: ${{ inputs.environment }}
    strategy:
      matrix:
        app: ${{ fromJson(needs.resolve.outputs.apps) }}
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/gfw-int-infrastructure/frontend/${{ matrix.app }}:${{ inputs.image-tag || format('latest-{0}', inputs.env-suffix) }}
      CLOUDRUN_SA: frontend-${{ inputs.env-suffix }}@${{ inputs.cloudrun-project }}.iam.gserviceaccount.com
      RUN_SMOKE_TESTS: ${{ matrix.app == 'platform' && (inputs.env-suffix == 'sta' || inputs.env-suffix == 'pro') }}
      # Nx Cloud read-write token only for the protected branches and releases. A workflow_dispatch
      # from any other branch reads the cache but cannot write to it.
      NX_CLOUD_CI_TOKEN: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.event_name == 'release') && secrets.NX_CLOUD_ACCESS_TOKEN || secrets.NX_CLOUD_ACCESS_TOKEN_READ_ONLY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Build image
        uses: ./.github/actions/build-image
        with:
          app: ${{ matrix.app }}
          image: ${{ env.IMAGE }}
          config: ${{ inputs.config }}
          nx-cloud-access-token: ${{ env.NX_CLOUD_CI_TOKEN }}
          extra-build-args: ${{ inputs.build-args }}
          export-stage: ${{ matrix.app == 'platform' && 'load-boundaries-report' || '' }}

      # Report only: what each page loads in the real build. Never blocks the deploy.
      - name: Load boundaries summary
        if: matrix.app == 'platform'
        run: |
          if [ -f docker-export/load-boundaries.md ]; then
            cat docker-export/load-boundaries.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No load-boundaries report was exported from the image build"
          fi

      - name: Run smoke tests
        if: env.RUN_SMOKE_TESTS == 'true'
        uses: ./.github/actions/smoke-test
        with:
          image: ${{ env.IMAGE }}
          nx-cloud-access-token: ${{ env.NX_CLOUD_CI_TOKEN }}
          test-user-email: ${{ secrets.TEST_USER_EMAIL }}
          test-user-password: ${{ secrets.TEST_USER_PASSWORD }}
          test-user-name: ${{ secrets.TEST_USER_NAME }}
          use-local-domain-proxy: ${{ inputs.env-suffix == 'pro' }}

      - name: Push image
        run: docker push "${{ env.IMAGE }}"

      - name: Deploy
        uses: ./.github/actions/deploy-cloudrun
        with:
          app: ${{ matrix.app }}
          image: ${{ env.IMAGE }}
          config: ${{ inputs.config }}
          service-name-prefix: ${{ inputs.service-prefix }}
          cloudrun-service-account: ${{ env.CLOUDRUN_SA }}
          cloudrun-project: ${{ inputs.cloudrun-project }}

  notify-failure:
    name: Notify Slack on failure
    runs-on: ubuntu-latest
    needs: [resolve, build-and-deploy]
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # One develop push fans out to three dev envs that share a ref and an
      # env-suffix, so only the image tag tells them apart. sta and pro are already
      # named by their ref (main, or the release tag).
      - name: Name the environment
        id: env
        shell: bash
        env:
          TAG: ${{ inputs.image-tag || format('latest-{0}', inputs.env-suffix) }}
          SUFFIX: ${{ inputs.env-suffix }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$SUFFIX" in
            dev*) echo "name=${TAG#latest-}" >> "$GITHUB_OUTPUT" ;;
            *)    echo "name=$REF"           >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Notify Slack
        uses: ./.github/actions/notify-slack
        with:
          channel: '#eng-cloud-build'
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          message: ":red_circle: *Build and Deploy failed* on `${{ steps.env.outputs.name }}`\n<!subteam^S091F43KM6F> please take a look. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
