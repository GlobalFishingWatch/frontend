name: Smoke Tests
description: Runs a locally built image and drives it with the @smoke Playwright suite

inputs:
  image:
    description: Local Docker image tag to run
    required: true
  nx-cloud-access-token:
    description: NX Cloud access token
    required: false
    default: ''
  test-user-email:
    description: Account the login smoke test signs in with
    required: true
  test-user-password:
    description: Password for test-user-email
    required: true
  test-user-name:
    description: Display name shown once test-user-email is logged in — LoginPage asserts on it
    required: true
  port:
    description: |
      Host port to publish the container on. Nitro listens on 3000 inside — this is
      the host-side mapping only. Must stay 3003: that's the exact localhost callback
      staging's SSO app has allowlisted (matching local dev's `vite --port=3003`); any
      other host port makes login fail with "Callback ... not registered". Ignored
      when use-local-domain-proxy is true — the proxy's target port is what matters then.
    required: false
    default: '3003'
  use-local-domain-proxy:
    description: |
      Production's SSO app allows no plain-localhost callback at all — only
      https://local.globalfishingwatch.org, the same hostname apps/platform/README.md
      documents for local HTTPS dev (`nx run platform:start-proxy`). Set true to stand
      up that same setup — a hosts-file entry, a throwaway self-signed cert, and
      local-ssl-proxy terminating TLS on :443 in front of the container — and run the
      suite against https://local.globalfishingwatch.org instead of plain localhost.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/setup@v2
      with:
        install: false # the explicit --frozen-lockfile step below owns installing
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'pnpm'
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Run the image
      shell: bash
      run: |
        docker run -d --name smoke-target \
          -p ${{ inputs.port }}:3000 \
          "${{ inputs.image }}"

    - name: Set up local.globalfishingwatch.org proxy
      if: inputs.use-local-domain-proxy == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! grep -q local.globalfishingwatch.org /etc/hosts; then
          echo "127.0.0.1 local.globalfishingwatch.org" | sudo tee -a /etc/hosts > /dev/null
          echo "::1 local.globalfishingwatch.org" | sudo tee -a /etc/hosts > /dev/null
        fi
        openssl req -x509 -newkey rsa:2048 \
          -keyout /tmp/local.globalfishingwatch.org-key.pem \
          -out /tmp/local.globalfishingwatch.org.pem \
          -days 1 -nodes \
          -subj "/CN=local.globalfishingwatch.org" \
          -addext "subjectAltName=DNS:local.globalfishingwatch.org"
        sudo "$(pnpm bin)/local-ssl-proxy" \
          --key /tmp/local.globalfishingwatch.org-key.pem \
          --cert /tmp/local.globalfishingwatch.org.pem \
          --source 443 --target ${{ inputs.port }} &

    - name: Run smoke tests
      shell: bash
      run: pnpm exec nx test platform-e2e -c smoke
      env:
        NX_DAEMON: 'false'
        NX_CLOUD_ACCESS_TOKEN: ${{ inputs.nx-cloud-access-token }}
        PLAYWRIGHT_BASE_URL: ${{ inputs.use-local-domain-proxy == 'true' && 'https://local.globalfishingwatch.org' || format('http://localhost:{0}', inputs.port) }}
        TEST_USER_EMAIL: ${{ inputs.test-user-email }}
        TEST_USER_PASSWORD: ${{ inputs.test-user-password }}
        TEST_USER_NAME: ${{ inputs.test-user-name }}

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.run_id }}
        path: apps/platform-e2e/playwright-report
        retention-days: 7

    - name: Dump container logs
      if: failure()
      shell: bash
      run: docker logs smoke-target || true

    - name: Stop the container
      if: always()
      shell: bash
      run: |
        docker rm -f smoke-target || true
        if [ "${{ inputs.use-local-domain-proxy }}" = "true" ]; then
          sudo pkill -f local-ssl-proxy || true
        fi
