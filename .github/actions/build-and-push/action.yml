name: Build and Push Docker Image
description: Reads build config, fetches secrets, and builds/pushes a Docker image to Artifact Registry

inputs:
  app:
    description: Application name
    required: true
  image:
    description: Full Docker image URI to push
    required: true
  config:
    description: Path to the app config YAML file
    required: false
    default: .github/apps/development.yml
  nx-cloud-access-token:
    description: NX Cloud access token passed as a Docker BuildKit secret
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Configure Docker for Artifact Registry
      shell: bash
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Prepare build config
      id: prepare
      shell: bash
      run: |
        set -euo pipefail

        APP_CONFIG=$(python3 -c "
        import yaml, json
        config = yaml.safe_load(open('${{ inputs.config }}'))
        app = config.get('${{ inputs.app }}')
        if not app:
          raise SystemExit(f'Unknown app: ${{ inputs.app }} — no config defined')
        print(json.dumps(app))
        ")

        ARGS="APP_NAME=${{ inputs.app }}"
        ARGS+=$'\n'"COMMIT_SHA=${{ github.sha }}"

        while IFS= read -r line; do
          ARGS+=$'\n'"$line"
        done < <(echo "$APP_CONFIG" | jq -r '.build.env_vars | to_entries[] | "\(.key)=\(.value)"')

        SECRET_MAPPINGS=$(echo "$APP_CONFIG" | jq -r '(.build.secrets // {}) | to_entries[] | "\(.key):\(.value)"')
        SECRET_NAMES=$(echo "$APP_CONFIG" | jq -c '(.build.secrets // {}) | keys')
        TARGET=$(echo "$APP_CONFIG" | jq -r '.target')

        {
          echo "args<<EOF"
          echo "$ARGS"
          echo "EOF"
          echo "secret_mappings<<EOF"
          echo "$SECRET_MAPPINGS"
          echo "EOF"
          echo "secret_names=$SECRET_NAMES"
          echo "target=$TARGET"
        } >> "$GITHUB_OUTPUT"

    - name: Fetch build secrets
      id: build-secrets
      if: steps.prepare.outputs.secret_mappings != ''
      uses: google-github-actions/get-secretmanager-secrets@v3
      with:
        secrets: ${{ steps.prepare.outputs.secret_mappings }}
        export_to_environment: true

    - name: Assemble docker secrets
      id: docker-secrets
      shell: bash
      run: |
        SECRETS="NX_CLOUD_ACCESS_TOKEN=${{ inputs.nx-cloud-access-token }}"
        while IFS= read -r name; do
          val=$(printenv "$name" || true)
          [ -n "$val" ] && SECRETS+=$'\n'"$name=$val"
        done < <(echo '${{ steps.prepare.outputs.secret_names }}' | jq -r '.[]')
        { echo "value<<EOF"; echo "$SECRETS"; echo "EOF"; } >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        target: ${{ steps.prepare.outputs.target }}
        push: true
        tags: ${{ inputs.image }}
        build-args: ${{ steps.prepare.outputs.args }}
        secrets: ${{ steps.docker-secrets.outputs.value }}
        cache-from: type=gha,scope=frontend
        cache-to: type=gha,scope=frontend,mode=max
