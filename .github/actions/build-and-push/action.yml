name: Build and Push Docker Image
description: Reads build config, fetches secrets, and builds/pushes a Docker image to Artifact Registry

inputs:
  app:
    description: Application name
    required: true
  image:
    description: Full Docker image URI to push
    required: true
  config:
    description: Path to the app config YAML file
    required: false
    default: .github/apps/development.yml
  nx-cloud-access-token:
    description: NX Cloud access token passed as a Docker BuildKit secret
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure Docker for Artifact Registry
      shell: bash
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Prepare build args
      id: prepare
      shell: bash
      run: |
        set -euo pipefail

        APP_CONFIG=$(python3 -c "
        import yaml, json, sys
        config = yaml.safe_load(open('${{ inputs.config }}'))
        print(json.dumps(config.get('${{ inputs.app }}')))
        ")

        ARGS="APP_NAME=${{ inputs.app }}"
        ARGS+=$'\n'"COMMIT_SHA=${{ github.sha }}"

        while IFS= read -r line; do
          ARGS+=$'\n'"$line"
        done < <(echo "$APP_CONFIG" | jq -r '.build.env_vars | to_entries[] | "\(.key)=\(.value)"')

        while IFS=$'\t' read -r env_var secret_path; do
          value=$(gcloud secrets versions access "$secret_path" --quiet)
          echo "::add-mask::$value"
          ARGS+=$'\n'"$env_var=$value"
        done < <(echo "$APP_CONFIG" | jq -r '(.build.secrets // {}) | to_entries[] | [.key, .value] | @tsv')

        TARGET=$(echo "$APP_CONFIG" | jq -r '.target')

        {
          echo "args<<EOF"
          echo "$ARGS"
          echo "EOF"
          echo "target=$TARGET"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        target: ${{ steps.prepare.outputs.target }}
        push: true
        tags: ${{ inputs.image }}
        build-args: ${{ steps.prepare.outputs.args }}
        secrets: |
          NX_CLOUD_ACCESS_TOKEN=${{ inputs.nx-cloud-access-token }}
        cache-from: type=gha,scope=frontend
        cache-to: type=gha,scope=frontend,mode=max
