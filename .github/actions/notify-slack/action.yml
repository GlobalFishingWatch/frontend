name: Notify Slack
description: Posts a message to a Slack channel using the Slack bot

inputs:
  channel:
    description: Slack channel ID to post the message to
    required: true
  message:
    description: Message text to post
    required: true
  token:
    description: Slack bot OAuth token (authorization bearer)
    required: true

runs:
  using: composite
  steps:
    - name: Post message to Slack
      shell: bash
      run: |
        curl -s -X POST https://slack.com/api/chat.postMessage \
          -H "Content-type: application/json" \
          -H "Authorization: Bearer ${{ inputs.token }}" \
          --data "{\"channel\": \"${{ inputs.channel }}\", \"text\": \"${{ inputs.message }}\"}"
