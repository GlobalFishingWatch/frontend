name: Build Docker Image
description: |
  Builds the app on the runner with Nx (cached), then packages its output into a Docker image
  loaded into the local daemon. Never pushes — the caller pushes explicitly once it's ready to.

inputs:
  app:
    description: Application name
    required: true
  image:
    description: Local Docker image tag to build
    required: true
  config:
    description: Path to the app config YAML file
    required: false
    default: .github/apps/development.yml
  extra-build-args:
    description: |
      Newline-separated KEY=VALUE build env appended after the config's env_vars, so they
      override it. Exported to the Nx build, not passed to docker.
    required: false
    default: ''
  cache-scope:
    description: |
      Nx cache entry name. Builds that differ only in env (flag environments) need their own
      scope, or concurrent jobs race to save the same key. Defaults to the app name.
    required: false
    default: ''

outputs:
  load-boundaries-report:
    description: Path of the platform load-boundaries report, empty when the build wrote none
    value: ${{ steps.build.outputs.load-boundaries-report }}

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/setup@v3
      with:
        install: false # the explicit --frozen-lockfile step below owns installing
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'pnpm'
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Configure Docker for Artifact Registry
      shell: bash
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Prepare build config
      id: prepare
      shell: bash
      env:
        EXTRA_BUILD_ARGS: ${{ inputs.extra-build-args }}
      run: |
        set -euo pipefail

        APP_CONFIG=$(python3 -c "
        import yaml, json
        config = yaml.safe_load(open('${{ inputs.config }}'))
        app = config.get('${{ inputs.app }}')
        if not app:
          raise SystemExit(f'Unknown app: ${{ inputs.app }} — no config defined')
        print(json.dumps(app))
        ")

        ARGS="COMMIT_SHA=${{ github.sha }}"

        while IFS= read -r line; do
          ARGS+=$'\n'"$line"
        done < <(echo "$APP_CONFIG" | jq -r '.build.env_vars | to_entries[] | "\(.key)=\(.value)"')

        # Appended last so a caller override beats the config value
        while IFS= read -r line; do
          [ -n "$line" ] && ARGS+=$'\n'"$line"
        done <<< "$EXTRA_BUILD_ARGS"

        # Collapse repeated keys to their last value: an override of a key already in the
        # config (say VITE_REALTIME_ENABLED) silently flips app behaviour, so make it explicit.
        ARGS=$(awk -F= '
          { if (!($1 in seen)) order[++n] = $1; seen[$1] = $0 }
          END { for (i = 1; i <= n; i++) print seen[order[i]] }
        ' <<< "$ARGS")

        SECRET_MAPPINGS=$(echo "$APP_CONFIG" | jq -r '(.build.secrets // {}) | to_entries[] | "\(.key):\(.value)"')
        TARGET=$(echo "$APP_CONFIG" | jq -r '.target')
        WORKSPACE_ENV=$(awk -F= '$1 == "VITE_WORKSPACE_ENV" { sub(/^[^=]*=/, ""); print }' <<< "$ARGS")

        {
          echo "env<<EOF"
          echo "$ARGS"
          echo "EOF"
          echo "secret_mappings<<EOF"
          echo "$SECRET_MAPPINGS"
          echo "EOF"
          echo "target=$TARGET"
          echo "workspace_env=$WORKSPACE_ENV"
        } >> "$GITHUB_OUTPUT"

    # Exported to the job env, where the Nx build below reads them
    - name: Fetch build secrets
      if: steps.prepare.outputs.secret_mappings != ''
      uses: google-github-actions/get-secretmanager-secrets@v3
      with:
        secrets: ${{ steps.prepare.outputs.secret_mappings }}
        export_to_environment: true

    # Nx rejects artifacts copied into its local cache dir on another machine, so the restored
    # directory is served to it through the self-hosted remote cache protocol instead.
    # Only develop and main save it; every other ref (PRs, release tags) only reads.
    - name: Restore Nx cache
      id: nx-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/nx-remote-cache
        key: nx-${{ runner.os }}-${{ inputs.cache-scope || inputs.app }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-${{ inputs.cache-scope || inputs.app }}-
          nx-${{ runner.os }}-${{ inputs.app }}-

    - name: Start Nx cache server
      id: nx-cache-server
      shell: bash
      env:
        NX_CACHE_SERVER_DIR: ${{ runner.temp }}/nx-remote-cache
        NX_CACHE_SERVER_PORT: '4911'
        NX_CACHE_SERVER_READ_ONLY: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
      run: |
        set -euo pipefail
        TOKEN=$(openssl rand -hex 16)
        echo "::add-mask::$TOKEN"
        # Anything older than this marker after the build was not used by it, and is pruned
        touch "$RUNNER_TEMP/nx-cache-marker"
        NX_CACHE_SERVER_TOKEN="$TOKEN" nohup node "$GITHUB_ACTION_PATH/nx-cache-server.mjs" \
          > "$RUNNER_TEMP/nx-cache-server.log" 2>&1 &
        echo "pid=$!" >> "$GITHUB_OUTPUT"
        echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        echo "url=http://127.0.0.1:$NX_CACHE_SERVER_PORT" >> "$GITHUB_OUTPUT"
        # Any HTTP status means it is listening
        curl -s -o /dev/null --retry 20 --retry-delay 1 --retry-all-errors "http://127.0.0.1:$NX_CACHE_SERVER_PORT/"
        cat "$RUNNER_TEMP/nx-cache-server.log"

    - name: Build ${{ inputs.app }}
      id: build
      shell: bash
      env:
        BUILD_ENV: ${{ steps.prepare.outputs.env }}
        NODE_ENV: production
        NODE_OPTIONS: --max-old-space-size=6144
        NX_DAEMON: 'false'
        NX_ISOLATE_PLUGINS: 'false'
        NX_NO_CLOUD: 'true'
        NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ steps.nx-cache-server.outputs.url }}
        NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ steps.nx-cache-server.outputs.token }}
        HUSKY: '0'
      run: |
        set -euo pipefail
        while IFS= read -r line; do
          [ -n "$line" ] && export "$line"
        done <<< "$BUILD_ENV"
        pnpm exec nx run "${{ inputs.app }}:build" --parallel=4 --output-style=stream
        REPORT="apps/${{ inputs.app }}/dist/load-boundaries.md"
        if [ -f "$REPORT" ]; then echo "load-boundaries-report=$REPORT" >> "$GITHUB_OUTPUT"; fi

    - name: Stop Nx cache server
      if: always() && steps.nx-cache-server.outputs.pid != ''
      shell: bash
      run: |
        kill "${{ steps.nx-cache-server.outputs.pid }}" 2>/dev/null || true
        sleep 1
        cat "$RUNNER_TEMP/nx-cache-server.log" || true

    - name: Prune unused Nx cache entries
      if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
      shell: bash
      run: |
        find "$RUNNER_TEMP/nx-remote-cache" -type f ! -newer "$RUNNER_TEMP/nx-cache-marker" -delete
        du -sh "$RUNNER_TEMP/nx-remote-cache"

    - name: Save Nx cache
      if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && steps.nx-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/nx-remote-cache
        key: nx-${{ runner.os }}-${{ inputs.cache-scope || inputs.app }}-${{ github.sha }}

    # The context is only the build output (.dockerignore), so this copies files and nothing more
    - name: Build Docker image
      shell: bash
      run: |
        docker build \
          --target "${{ steps.prepare.outputs.target }}" \
          --build-arg APP_NAME="${{ inputs.app }}" \
          --build-arg COMMIT_SHA="${{ github.sha }}" \
          --build-arg VITE_WORKSPACE_ENV="${{ steps.prepare.outputs.workspace_env }}" \
          --tag "${{ inputs.image }}" \
          .
