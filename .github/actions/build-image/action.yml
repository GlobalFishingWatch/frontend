name: Build Docker Image
description: Builds the app with Nx on the runner and packages its output into a local Docker image. Never pushes.

inputs:
  app:
    description: Application name
    required: true
  image:
    description: Local Docker image tag to build
    required: true
  config:
    description: Path to the app config YAML file
    required: false
    default: .github/apps/development.yml
  extra-build-args:
    description: Newline-separated KEY=VALUE build env that overrides the config's env_vars
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/setup@v3
      with:
        install: false
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Restore Nx cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/nx-cache
        key: nx-${{ inputs.app }}-${{ inputs.image }}-${{ github.sha }}
        restore-keys: |
          nx-${{ inputs.app }}-${{ inputs.image }}-
          nx-${{ inputs.app }}-

    - name: Start Nx cache server
      shell: bash
      run: |
        touch "$RUNNER_TEMP/nx-cache-start"
        node "$GITHUB_ACTION_PATH/nx-cache-server.mjs" "$RUNNER_TEMP/nx-cache" > "$RUNNER_TEMP/nx-cache.log" 2>&1 &

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Read build env
      shell: bash
      env:
        APP: ${{ inputs.app }}
        CONFIG: ${{ inputs.config }}
        EXTRA_BUILD_ENV: ${{ inputs.extra-build-args }}
      run: |
        yq 'explode(.) | .[env(APP)].build.env_vars | to_entries | .[] | .key + "=" + .value' "$CONFIG" >> "$GITHUB_ENV"
        echo "$EXTRA_BUILD_ENV" >> "$GITHUB_ENV"

    - name: Read build secrets
      id: secrets
      shell: bash
      env:
        APP: ${{ inputs.app }}
        CONFIG: ${{ inputs.config }}
      run: |
        {
          echo 'mappings<<EOF'
          yq 'explode(.) | .[env(APP)].build.secrets | to_entries | .[] | .key + ":" + .value' "$CONFIG"
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: Fetch build secrets
      if: steps.secrets.outputs.mappings != ''
      uses: google-github-actions/get-secretmanager-secrets@v3
      with:
        secrets: ${{ steps.secrets.outputs.mappings }}
        export_to_environment: true

    - name: Configure Docker for Artifact Registry
      shell: bash
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Build
      shell: bash
      env:
        APP: ${{ inputs.app }}
        CONFIG: ${{ inputs.config }}
        IMAGE: ${{ inputs.image }}
        COMMIT_SHA: ${{ github.sha }}
        NODE_ENV: production
        NODE_OPTIONS: --max-old-space-size=6144
        NX_NO_CLOUD: 'true'
        NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:4911
      run: |
        pnpm nx run "$APP:build" --parallel=4
        docker build . \
          --target "$(yq '.[env(APP)].target' "$CONFIG")" \
          --build-arg APP_NAME="$APP" \
          --build-arg COMMIT_SHA \
          --build-arg VITE_WORKSPACE_ENV \
          --tag "$IMAGE"

    - name: Drop Nx cache entries this build did not use
      shell: bash
      run: find "$RUNNER_TEMP/nx-cache" -type f ! -newer "$RUNNER_TEMP/nx-cache-start" -delete

    - name: Save Nx cache
      if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/nx-cache
        key: nx-${{ inputs.app }}-${{ inputs.image }}-${{ github.sha }}
