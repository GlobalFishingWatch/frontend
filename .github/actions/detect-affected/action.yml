name: Detect Affected Apps
description: Uses NX to output a JSON array of apps affected between two refs

inputs:
  base:
    description: Base ref for the affected comparison
    required: true
  head:
    description: Head ref for the affected comparison
    required: true

outputs:
  apps:
    description: JSON array of affected app names
    value: ${{ steps.affected.outputs.apps }}

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Get affected apps
      id: affected
      shell: bash
      run: |
        set -euo pipefail

        AFFECTED=$(pnpm exec nx show projects \
          --affected \
          --base=${{ inputs.base }} \
          --head=${{ inputs.head }} \
          --type app \
          --exclude='linting,port-labeler,*-e2e' \
          --plain | grep -E '^[a-zA-Z][a-zA-Z0-9_-]*$' || true)

        if [ -z "$AFFECTED" ]; then
          APPS_JSON="[]"
          echo "No affected apps found — skipping build"
        else
          APPS_JSON=$(printf '%s\n' $AFFECTED | jq -R . | jq -sc .)
          echo "Affected apps: $APPS_JSON"
        fi

        echo "apps=$APPS_JSON" >> $GITHUB_OUTPUT
