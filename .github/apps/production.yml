build_env_vars: &build_env_vars
  VITE_API_GATEWAY: https://gateway.api.globalfishingwatch.org
  VITE_GOOGLE_MEASUREMENT_ID: G-R3PWRQW70G
  VITE_GOOGLE_TAG_MANAGER_ID: GTM-KK5ZFST

platform:
  target: production-node
  build:
    env_vars:
      <<: *build_env_vars
      VITE_GOOGLE_TAG_MANAGER_ID: GTM-WXTMN69
      VITE_API_VERSION: v3
      VITE_USE_LOCAL_DATASETS: 'false'
      VITE_USE_LOCAL_DATAVIEWS: 'false'
      VITE_WORKSPACE_ENV: production
      VITE_REPORT_DAYS_LIMIT: '366'
    secrets:
      SENTRY_AUTH_TOKEN: projects/674016975526/secrets/FISHING_MAP_SENTRY_AUTH_TOKEN/versions/latest
  deploy:
    env_vars:
      BASIC_AUTH: off
    secrets:
      STRAPI_TOKEN: projects/674016975526/secrets/FISHING_MAP_STRAPI_TOKEN/versions/latest
      STRAPI_URL: projects/674016975526/secrets/FISHING_MAP_STRAPI_URL/versions/latest
      DOWNLOAD_SURVEY_SPREADSHEET_ID: projects/674016975526/secrets/FISHING_MAP_DOWNLOAD_SURVEY_SPREADSHEET_ID/versions/latest
      FEEDBACK_SPREADSHEET_ID: projects/674016975526/secrets/FISHING_MAP_FEEDBACK_SPREADSHEET_ID/versions/latest
      GFW_API_KEY: projects/674016975526/secrets/FISHING_MAP_GFW_API_KEY/versions/latest
      IDENTITY_REVIEW_SPREADSHEET_ID: projects/674016975526/secrets/FISHING_MAP_IDENTITY_REVIEW_SPREADSHEET_ID/versions/latest
      MAP_ERRORS_SPREADSHEET_ID: projects/674016975526/secrets/FISHING_MAP_MAP_ERRORS_SPREADSHEET_ID/versions/latest
      MIGRAMAR_SPREADSHEET_ID: projects/674016975526/secrets/FISHING_MAP_MIGRAMAR_SPREADSHEET_ID/versions/latest
      SENTRY_AUTH_TOKEN: projects/674016975526/secrets/FISHING_MAP_SENTRY_AUTH_TOKEN/versions/latest
      SPREADSHEET_CLIENT_EMAIL: projects/674016975526/secrets/FISHING_MAP_SPREADSHEET_CLIENT_EMAIL/versions/latest
      SPREADSHEET_PRIVATE_KEY: projects/674016975526/secrets/FISHING_MAP_SPREADSHEET_PRIVATE_KEY/versions/latest
      TURNING_TIDES_AIS_ID: projects/674016975526/secrets/FISHING_MAP_TURNING_TIDES_AIS_ID/versions/latest
      TURNING_TIDES_BRAZIL_ID: projects/674016975526/secrets/FISHING_MAP_TURNING_TIDES_BRAZIL_ID/versions/latest
      TURNING_TIDES_CHILE_ID: projects/674016975526/secrets/FISHING_MAP_TURNING_TIDES_CHILE_ID/versions/latest
      TURNING_TIDES_PERU_ID: projects/674016975526/secrets/FISHING_MAP_TURNING_TIDES_PERU_ID/versions/latest

api-portal:
