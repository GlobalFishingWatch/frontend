# pnpm reads only auth/registry settings from .npmrc, so this lives here.
autoInstallPeers: true

packages:
  - 'linting'
  - 'apps/*'
  - 'apps/platform/config'
  - 'libs/*'

overrides:
  adm-zip@0.5: 0.6.0
  axios@1: 1.20.0
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  fast-uri@3: 3.1.9
  fflate@0.7: 0.7.5
  glob@13: 14.0.3
  http-proxy-middleware@3: 3.0.7
  minimatch@10: 11.0.4
  minimatch@9: 11.0.4
  nanoid@3: 3.3.18
  piscina@4: 4.9.4
  postcss@8: 8.5.25
  protobufjs@7: 7.6.5
  qs@6: 6.17.1
  serialize-javascript@6: 7.0.7
  seroval-plugins@1: 1.6.12
  seroval@1: 1.6.12
  svgo@3: 3.3.4
  undici@7: 7.30.1

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  # transitive: i18next-cli and nx's optional swc loader ship native bindings
  '@swc/core': true
  core-js: true
  esbuild: true
  less: true
  nx: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
  # Removes a lookbehind from the email-autolink regex. Safari/iOS <16.4 can't parse
  # lookbehind regex literals, so the whole bundle chunk fails to load and crashes the
  # app for those users. Remove once we drop support for Safari <16.4.
  mdast-util-gfm-autolink-literal@2.0.1: patches/mdast-util-gfm-autolink-literal@2.0.1.patch

minimumReleaseAgeExclude:
  - i18next-cli@1.82.2
