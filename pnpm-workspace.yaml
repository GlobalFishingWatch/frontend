# pnpm reads only auth/registry settings from .npmrc, so this lives here.
autoInstallPeers: true

packages:
  - 'linting'
  - 'apps/*'
  - 'apps/platform/config'
  - 'libs/*'

overrides:
  adm-zip@0.5: 0.6.0
  axios@1: 1.19.0
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.4
  brace-expansion@5: 5.0.9
  fast-uri@3: 3.1.5
  http-proxy-middleware@3: 3.0.7
  minimatch@9: 9.0.9
  nanoid@3: 3.3.18
  piscina@4: 4.9.3
  postcss@8: 8.5.25
  protobufjs@7: 7.6.5
  serialize-javascript@6: 7.0.7
  svgo@3: 3.3.4
  undici@7: 7.29.0

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  # transitive: i18next-cli and nx's optional swc loader ship native bindings
  '@swc/core': true
  core-js: true
  esbuild: true
  less: true
  nx: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
  # The SVG layout zoom (`zoom: <dpr>` inside a `scale(1/dpr)` group) always followed
  # window.devicePixelRatio. macOS Preview applies that zoom twice to nested svgs, so the `dpr`
  # option now caps it and SVG exports pass `dpr: 1`. Redo on every snapdom upgrade.
  '@zumer/snapdom@3.7.0': patches/@zumer__snapdom@3.7.0.patch
  # Adds an import.meta.dirname fallback + exports map so h3-js resolves __dirname in
  # the ESM (Vite/Nitro) server bundle. Remove once h3-js publishes ESM-safe builds.
  h3-js@4.4.0: patches/h3-js@4.4.0.patch
  # `extract --watch` runs one extraction at a time (it started one per changed file, so a
  # branch switch ran hundreds at once, ~1.3 GB) and watches folders instead of the files
  # present at startup, so new files get extracted. Still unfixed upstream in 1.82.1.
  # Also keeps preserved keys in their on-disk shape: since 1.80.4 every key with an empty
  # segment is written flat, so the nested `"": "Unknown"` under vessel.gearTypes /
  # vesselTypes became a top-level `"vessel.gearTypes."` key.
  i18next-cli@1.82.0: patches/i18next-cli@1.82.0.patch
  # Removes a lookbehind from the email-autolink regex. Safari/iOS <16.4 can't parse
  # lookbehind regex literals, so the whole bundle chunk fails to load and crashes the
  # app for those users. Remove once we drop support for Safari <16.4.
  mdast-util-gfm-autolink-literal@2.0.1: patches/mdast-util-gfm-autolink-literal@2.0.1.patch
